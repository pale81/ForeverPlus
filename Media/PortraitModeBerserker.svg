<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="58%">
      <stop offset="0%" stop-color="#8b2117"/>
      <stop offset="52%" stop-color="#480d0a"/>
      <stop offset="100%" stop-color="#190404"/>
    </radialGradient>
    <linearGradient id="steelL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2f6fa"/>
      <stop offset="48%" stop-color="#9ca7b4"/>
      <stop offset="100%" stop-color="#474f5a"/>
    </linearGradient>
    <linearGradient id="steelR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2f6fa"/>
      <stop offset="48%" stop-color="#9ca7b4"/>
      <stop offset="100%" stop-color="#474f5a"/>
    </linearGradient>
    <linearGradient id="haft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a8703e"/>
      <stop offset="55%" stop-color="#603a1e"/>
      <stop offset="100%" stop-color="#2c180c"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe39e"/>
      <stop offset="50%" stop-color="#c48c42"/>
      <stop offset="100%" stop-color="#613a1b"/>
    </linearGradient>
    <linearGradient id="bloodEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6238"/>
      <stop offset="50%" stop-color="#d61f19"/>
      <stop offset="100%" stop-color="#8c0d0c"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" fill="url(#bg)"/>
  <!-- Subtle battle ember ring -->
  <circle cx="64" cy="64" r="43" fill="none" stroke="#ff6e3a" stroke-opacity=".2" stroke-width="1.8"/>
  <!-- Left axe (blade facing outward left, handle down-right) -->
  <g transform="rotate(-40 64 64)">
    <!-- Handle -->
    <rect x="59.5" y="18" width="9" height="92" rx="4" fill="url(#haft)" stroke="#1b0e0a" stroke-width="3.6"/>
    <!-- Pommel & top cap -->
    <circle cx="64" cy="108" r="6" fill="url(#brass)" stroke="#1b0e0a" stroke-width="3"/>
    <path d="M58 22 L64 12 L70 22 Z" fill="url(#brass)" stroke="#1b0e0a" stroke-width="2.8" stroke-linejoin="round"/>
    <!-- Single bearded war-axe blade facing left -->
    <path d="M60 28 C47 21 31 20 22 28 C25 41 25 54 20 69 C33 73 48 66 60 54 Z"
          fill="url(#steelL)" stroke="#1a110e" stroke-width="3.8" stroke-linejoin="round"/>
    <!-- Back spike -->
    <path d="M68 33 L80 39 L68 45 Z" fill="url(#steelL)" stroke="#1a110e" stroke-width="3.2" stroke-linejoin="round"/>
    <!-- Crimson blade edge & notch -->
    <path d="M24 31 C27 42 27 54 23 66" fill="none" stroke="url(#bloodEdge)" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M32 33 C34 43 34 52 31 61" fill="none" stroke="#ffffff" stroke-opacity=".45" stroke-width="1.6" stroke-linecap="round"/>
    <!-- Socket collar -->
    <rect x="57" y="30" width="14" height="20" rx="3" fill="url(#brass)" stroke="#1c110b" stroke-width="3"/>
  </g>
  <!-- Right axe (blade facing outward right, handle down-left) -->
  <g transform="rotate(40 64 64)">
    <!-- Handle -->
    <rect x="59.5" y="18" width="9" height="92" rx="4" fill="url(#haft)" stroke="#1b0e0a" stroke-width="3.6"/>
    <!-- Pommel & top cap -->
    <circle cx="64" cy="108" r="6" fill="url(#brass)" stroke="#1b0e0a" stroke-width="3"/>
    <path d="M58 22 L64 12 L70 22 Z" fill="url(#brass)" stroke="#1b0e0a" stroke-width="2.8" stroke-linejoin="round"/>
    <!-- Single bearded war-axe blade facing right -->
    <path d="M68 28 C81 21 97 20 106 28 C103 41 103 54 108 69 C95 73 80 66 68 54 Z"
          fill="url(#steelR)" stroke="#1a110e" stroke-width="3.8" stroke-linejoin="round"/>
    <!-- Back spike -->
    <path d="M60 33 L48 39 L60 45 Z" fill="url(#steelR)" stroke="#1a110e" stroke-width="3.2" stroke-linejoin="round"/>
    <!-- Crimson blade edge & specular -->
    <path d="M104 31 C101 42 101 54 105 66" fill="none" stroke="url(#bloodEdge)" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M96 33 C94 43 94 52 97 61" fill="none" stroke="#ffffff" stroke-opacity=".45" stroke-width="1.6" stroke-linecap="round"/>
    <!-- Socket collar -->
    <rect x="57" y="30" width="14" height="20" rx="3" fill="url(#brass)" stroke="#1c110b" stroke-width="3"/>
  </g>
  <!-- Center bronze clasp with glowing rage gem -->
  <circle cx="64" cy="67" r="10" fill="#1a0d0a"/>
  <circle cx="64" cy="67" r="7.4" fill="url(#brass)"/>
  <circle cx="64" cy="67" r="3.6" fill="#d9261a"/>
  <circle cx="62.6" cy="65.6" r="1.3" fill="#ffd9a6"/>
</svg>
