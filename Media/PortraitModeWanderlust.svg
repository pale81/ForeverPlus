<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="58%">
      <stop offset="0%" stop-color="#335972"/>
      <stop offset="55%" stop-color="#1a3145"/>
      <stop offset="100%" stop-color="#0b1520"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff0bd"/>
      <stop offset="45%" stop-color="#d7a04e"/>
      <stop offset="100%" stop-color="#7c4e21"/>
    </linearGradient>
    <linearGradient id="goldDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b88138"/>
      <stop offset="100%" stop-color="#4e2e14"/>
    </linearGradient>
    <linearGradient id="north" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9955"/>
      <stop offset="50%" stop-color="#d94e2a"/>
      <stop offset="100%" stop-color="#7c2012"/>
    </linearGradient>
    <radialGradient id="gem" cx="38%" cy="34%" r="65%">
      <stop offset="0%" stop-color="#fff6cf"/>
      <stop offset="45%" stop-color="#e5aa4c"/>
      <stop offset="100%" stop-color="#784418"/>
    </radialGradient>
  </defs>
  <rect width="128" height="128" fill="url(#bg)"/>
  <!-- Subtle chart lines -->
  <circle cx="64" cy="64" r="46" fill="none" stroke="#85b4d1" stroke-opacity=".2" stroke-width="1.2"/>
  <circle cx="64" cy="64" r="34" fill="none" stroke="#85b4d1" stroke-opacity=".22" stroke-width="1" stroke-dasharray="3 4"/>
  <!-- Outer brass compass ring -->
  <circle cx="64" cy="64" r="41" fill="none" stroke="#18100a" stroke-width="8.5"/>
  <circle cx="64" cy="64" r="41" fill="none" stroke="url(#gold)" stroke-width="4.5"/>
  <circle cx="64" cy="64" r="38.5" fill="none" stroke="#472b14" stroke-width="1.1"/>
  <!-- Minor diagonal points -->
  <g stroke="#1b120b" stroke-width="2.4" stroke-linejoin="round">
    <polygon points="64,64 85,43 69,64" fill="url(#gold)"/>
    <polygon points="64,64 85,43 64,59" fill="url(#goldDark)"/>
    <polygon points="64,64 85,85 64,69" fill="url(#gold)"/>
    <polygon points="64,64 85,85 69,64" fill="url(#goldDark)"/>
    <polygon points="64,64 43,85 59,64" fill="url(#gold)"/>
    <polygon points="64,64 43,85 64,69" fill="url(#goldDark)"/>
    <polygon points="64,64 43,43 64,59" fill="url(#gold)"/>
    <polygon points="64,64 43,43 59,64" fill="url(#goldDark)"/>
  </g>
  <!-- Major cardinal points (East, South, West) -->
  <g stroke="#1b120b" stroke-width="2.8" stroke-linejoin="round">
    <polygon points="64,64 108,64 64,54" fill="url(#gold)"/>
    <polygon points="64,64 108,64 64,74" fill="url(#goldDark)"/>
    <polygon points="64,64 64,108 74,64" fill="url(#gold)"/>
    <polygon points="64,64 64,108 54,64" fill="url(#goldDark)"/>
    <polygon points="64,64 20,64 64,74" fill="url(#gold)"/>
    <polygon points="64,64 20,64 64,54" fill="url(#goldDark)"/>
    <!-- North point highlighted -->
    <polygon points="64,64 64,17 53,64" fill="url(#north)"/>
    <polygon points="64,64 64,17 75,64" fill="url(#gold)"/>
  </g>
  <!-- Specular highlights on blades -->
  <path d="M64 23 L60 58 M64 23 L68 58" stroke="#fff3c7" stroke-opacity=".55" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Center medallion -->
  <circle cx="64" cy="64" r="11.5" fill="#1b120b"/>
  <circle cx="64" cy="64" r="8.8" fill="url(#gem)"/>
  <circle cx="61.5" cy="61.2" r="2.7" fill="#fff9dd" opacity=".85"/>
</svg>
