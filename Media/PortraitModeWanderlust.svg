<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="256" height="256">
  <defs>
    <!-- Deep WoW Hunter/Explorer class-crest enamel backdrop -->
    <radialGradient id="shieldBg" cx="56%" cy="44%" r="58%">
      <stop offset="0%" stop-color="#2c594c"/>
      <stop offset="52%" stop-color="#15312c"/>
      <stop offset="86%" stop-color="#0b1a19"/>
      <stop offset="100%" stop-color="#050c0c"/>
    </radialGradient>
    <radialGradient id="innerRim" cx="32%" cy="24%" r="78%">
      <stop offset="0%" stop-color="#f2cf83"/>
      <stop offset="42%" stop-color="#9e7135"/>
      <stop offset="78%" stop-color="#4f3518"/>
      <stop offset="100%" stop-color="#241609"/>
    </radialGradient>
    <!-- Chunky forged Warcraft gold bevels -->
    <linearGradient id="goldBright" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff4c4"/>
      <stop offset="45%" stop-color="#e3ad4b"/>
      <stop offset="100%" stop-color="#946020"/>
    </linearGradient>
    <linearGradient id="goldDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9c6826"/>
      <stop offset="55%" stop-color="#5e3a14"/>
      <stop offset="100%" stop-color="#2b1808"/>
    </linearGradient>
    <!-- Chunky forged Warcraft iron/steel -->
    <linearGradient id="steelBright" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef5fa"/>
      <stop offset="45%" stop-color="#9fb0bd"/>
      <stop offset="100%" stop-color="#55626e"/>
    </linearGradient>
    <linearGradient id="steelDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#62717d"/>
      <stop offset="100%" stop-color="#252c33"/>
    </linearGradient>
    <!-- Glowing emerald-sapphire core gem -->
    <radialGradient id="wayGem" cx="35%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#e8fffb"/>
      <stop offset="32%" stop-color="#4ee3c8"/>
      <stop offset="70%" stop-color="#137d75"/>
      <stop offset="100%" stop-color="#062e30"/>
    </radialGradient>
    <filter id="crestAO" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="3.2" flood-color="#020808" flood-opacity=".95"/>
    </filter>
  </defs>

  <!-- Deep class-emblem shield field -->
  <rect width="128" height="128" fill="url(#shieldBg)"/>
  <!-- Heavy forged inner class-icon bevel ring -->
  <circle cx="64" cy="64" r="59" fill="none" stroke="url(#innerRim)" stroke-width="6"/>
  <circle cx="64" cy="64" r="55.5" fill="none" stroke="#081211" stroke-width="2.2"/>

  <!-- Chunky Warcraft Compass-Star Crest shifted up-right to (72, 54) away from level badge -->
  <g transform="translate(72, 54)" filter="url(#crestAO)">
    <!-- Heavy forged steel & bronze compass ring with chunky notched bosses -->
    <circle cx="0" cy="0" r="29" fill="none" stroke="#18100a" stroke-width="11.5"/>
    <circle cx="0" cy="0" r="29" fill="none" stroke="url(#goldBright)" stroke-width="7.2"/>
    <circle cx="0" cy="0" r="25.5" fill="none" stroke="#36210c" stroke-width="2"/>
    <!-- 4 chunky diagonal steel arrow-blades -->
    <g stroke="#140d08" stroke-width="1.8" stroke-linejoin="round">
      <polygon points="0,0 24,-24 9,-1" fill="url(#steelBright)"/>
      <polygon points="0,0 24,-24 1,-9" fill="url(#steelDark)"/>
      <polygon points="0,0 24,24 1,9" fill="url(#steelBright)"/>
      <polygon points="0,0 24,24 9,1" fill="url(#steelDark)"/>
      <polygon points="0,0 -24,24 -9,1" fill="url(#steelBright)"/>
      <polygon points="0,0 -24,24 -1,9" fill="url(#steelDark)"/>
      <polygon points="0,0 -24,-24 -1,-9" fill="url(#steelBright)"/>
      <polygon points="0,0 -24,-24 -9,-1" fill="url(#steelDark)"/>
    </g>
    <!-- 4 massive Warcraft beveled cardinal spears (North extra-bold) -->
    <g stroke="#140d08" stroke-width="2.1" stroke-linejoin="round">
      <!-- North -->
      <polygon points="0,0 0,-42 -11,-10" fill="url(#goldBright)"/>
      <polygon points="0,0 0,-42 11,-10" fill="url(#goldDark)"/>
      <!-- East -->
      <polygon points="0,0 38,0 10,-9.5" fill="url(#goldBright)"/>
      <polygon points="0,0 38,0 10,9.5" fill="url(#goldDark)"/>
      <!-- South -->
      <polygon points="0,0 0,38 9.5,10" fill="url(#goldBright)"/>
      <polygon points="0,0 0,38 -9.5,10" fill="url(#goldDark)"/>
      <!-- West -->
      <polygon points="0,0 -38,0 -10,9.5" fill="url(#goldBright)"/>
      <polygon points="0,0 -38,0 -10,-9.5" fill="url(#goldDark)"/>
    </g>
    <!-- Chunky specular edge highlights -->
    <path d="M-2 -35 L-7 -12 M31 -2 L12 -6 M-2 31 L-6 12 M-31 2 L-12 6" stroke="#fff9de" stroke-opacity=".65" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Heavy riveted center bezel + glowing wayfinder gem -->
    <circle cx="0" cy="0" r="13.5" fill="#17100a"/>
    <circle cx="0" cy="0" r="11.5" fill="url(#goldBright)"/>
    <circle cx="0" cy="0" r="8.2" fill="#121e1e"/>
    <circle cx="0" cy="0" r="7.2" fill="url(#wayGem)"/>
    <ellipse cx="-2.4" cy="-2.4" rx="2.6" ry="1.8" transform="rotate(-35 -2.4 -2.4)" fill="#ffffff" opacity=".88"/>
  </g>
</svg>
