<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="256" height="256">
  <defs>
    <!-- Deep WoW Paladin/Royal Lore class-crest burgundy backdrop -->
    <radialGradient id="shieldBg" cx="56%" cy="44%" r="58%">
      <stop offset="0%" stop-color="#6e2336"/>
      <stop offset="52%" stop-color="#3c1120"/>
      <stop offset="86%" stop-color="#1e0711"/>
      <stop offset="100%" stop-color="#0d0307"/>
    </radialGradient>
    <radialGradient id="innerRim" cx="32%" cy="24%" r="78%">
      <stop offset="0%" stop-color="#f2cf83"/>
      <stop offset="42%" stop-color="#9e7135"/>
      <stop offset="78%" stop-color="#4f3518"/>
      <stop offset="100%" stop-color="#241609"/>
    </radialGradient>
    <linearGradient id="goldBright" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff4c4"/>
      <stop offset="45%" stop-color="#e3ad4b"/>
      <stop offset="100%" stop-color="#87551c"/>
    </linearGradient>
    <linearGradient id="goldDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9c6826"/>
      <stop offset="100%" stop-color="#38200a"/>
    </linearGradient>
    <linearGradient id="tomeCover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#87382c"/>
      <stop offset="50%" stop-color="#521d1b"/>
      <stop offset="100%" stop-color="#240a0c"/>
    </linearGradient>
    <linearGradient id="pages" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b58d54"/>
      <stop offset="48%" stop-color="#faecc9"/>
      <stop offset="100%" stop-color="#c49a5e"/>
    </linearGradient>
    <linearGradient id="quillBright" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#d4b378"/>
      <stop offset="50%" stop-color="#fff9e8"/>
      <stop offset="100%" stop-color="#f5ce75"/>
    </linearGradient>
    <radialGradient id="rubyGem" cx="35%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#ffbfa3"/>
      <stop offset="35%" stop-color="#e82e20"/>
      <stop offset="75%" stop-color="#8f0f12"/>
      <stop offset="100%" stop-color="#3b0508"/>
    </radialGradient>
    <filter id="crestAO" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="3.2" flood-color="#0c0206" flood-opacity=".95"/>
    </filter>
  </defs>

  <!-- Deep class-emblem shield field -->
  <rect width="128" height="128" fill="url(#shieldBg)"/>
  <!-- Heavy forged inner bevel ring -->
  <circle cx="64" cy="64" r="59" fill="none" stroke="url(#innerRim)" stroke-width="6"/>
  <circle cx="64" cy="64" r="55.5" fill="none" stroke="#18050b" stroke-width="2.2"/>

  <!-- Chunky Warcraft Paladin-style Chronicle Tome & Forged Quill Crest at (72, 54) -->
  <g transform="translate(72, 54)" filter="url(#crestAO)">
    <!-- Massive armored leather tome angled heroically -->
    <g transform="rotate(-7)">
      <!-- Thick gilded page block on bottom/right edge -->
      <path d="M-24 -30 L22 -30 L26 -24 L26 28 L-18 28 L-24 22 Z" fill="url(#pages)" stroke="#1c0d09" stroke-width="2.8" stroke-linejoin="round"/>
      <!-- Heavy crimson-leather front cover -->
      <rect x="-26" y="-32" width="48" height="58" rx="4" fill="url(#tomeCover)" stroke="#1a0b09" stroke-width="2.8"/>
      <!-- Chunky gold spine ribs on left -->
      <path d="M-26 -32 L-16 -32 L-16 26 L-26 26 Z" fill="url(#goldDark)" stroke="#1a0b09" stroke-width="2"/>
      <rect x="-27" y="-20" width="12" height="6" rx="1.5" fill="url(#goldBright)" stroke="#1c0f08" stroke-width="1.6"/>
      <rect x="-27" y="4" width="12" height="6" rx="1.5" fill="url(#goldBright)" stroke="#1c0f08" stroke-width="1.6"/>
      <!-- Heavy Warcraft forged gold corner brackets -->
      <path d="M6 -32 L22 -32 L22 -16 L15 -16 L15 -25 L6 -25 Z" fill="url(#goldBright)" stroke="#1c0f08" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M6 26 L22 26 L22 10 L15 10 L15 19 L6 19 Z" fill="url(#goldBright)" stroke="#1c0f08" stroke-width="1.8" stroke-linejoin="round"/>
      <!-- Heavy gold book clasp on right -->
      <rect x="14" y="-8" width="14" height="12" rx="2.5" fill="url(#goldBright)" stroke="#1c0f08" stroke-width="2"/>
      <circle cx="21" cy="-2" r="2.2" fill="#3a200a"/>
      <!-- Center embossed gold crest & glowing ruby seal -->
      <polygon points="1,-17 12,-3 1,11 -10,-3" fill="url(#goldBright)" stroke="#1c0f08" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="1" cy="-3" r="6.8" fill="#1f0808"/>
      <circle cx="1" cy="-3" r="5.6" fill="url(#rubyGem)"/>
      <circle cx="-1" cy="-5" r="1.8" fill="#ffe6d6" opacity=".85"/>
    </g>

    <!-- Bold Warcraft gilded feather quill slashing boldly across upper-right -->
    <g>
      <path d="M-12 20 C2 2 16 -20 35 -37 C43 -39 46 -32 41 -22 C33 -7 18 9 1 18 L-10 21 Z"
            fill="url(#quillBright)" stroke="#1c1008" stroke-width="2.6" stroke-linejoin="round"/>
      <!-- Chunky feather notches -->
      <path d="M24 -20 L35 -22 M15 -9 L27 -10 M6 2 L18 2" stroke="#6e4b22" stroke-width="2.2" stroke-linecap="round"/>
      <!-- Heavy gold spine & nib -->
      <path d="M-17 26 Q7 1 36 -31" fill="none" stroke="#1c1008" stroke-width="5.2" stroke-linecap="round"/>
      <path d="M-16 25 Q7 1 36 -31" fill="none" stroke="url(#goldBright)" stroke-width="2.6" stroke-linecap="round"/>
      <polygon points="-22,31 -10,24 -15,19" fill="url(#goldBright)" stroke="#1c1008" stroke-width="2" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
