<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bg" cx="48%" cy="44%" r="60%">
      <stop offset="0%" stop-color="#6b2e37"/>
      <stop offset="56%" stop-color="#3a161e"/>
      <stop offset="100%" stop-color="#19080c"/>
    </radialGradient>
    <linearGradient id="parchment" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7e8c6"/>
      <stop offset="55%" stop-color="#dec08a"/>
      <stop offset="100%" stop-color="#ad864e"/>
    </linearGradient>
    <linearGradient id="roll" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fae9c5"/>
      <stop offset="55%" stop-color="#c99e60"/>
      <stop offset="100%" stop-color="#7c572d"/>
    </linearGradient>
    <linearGradient id="feather" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#d7b476"/>
      <stop offset="45%" stop-color="#fff4d6"/>
      <stop offset="100%" stop-color="#f0c86d"/>
    </linearGradient>
    <radialGradient id="seal" cx="38%" cy="34%" r="66%">
      <stop offset="0%" stop-color="#e85842"/>
      <stop offset="55%" stop-color="#a8201b"/>
      <stop offset="100%" stop-color="#5e0d0c"/>
    </radialGradient>
  </defs>
  <rect width="128" height="128" fill="url(#bg)"/>
  <!-- Warm candle halo -->
  <circle cx="62" cy="62" r="46" fill="#f5b762" opacity=".1"/>
  <!-- Scroll body -->
  <path d="M30 34 C30 28 36 25 42 25 L82 25 C88 25 91 29 90 36 L85 92 C84 98 79 101 73 101 L33 101 C28 101 25 97 26 91 Z"
        fill="url(#parchment)" stroke="#21140d" stroke-width="4" stroke-linejoin="round"/>
  <!-- Top and bottom rolled edges -->
  <rect x="27" y="22" width="66" height="13" rx="6.5" fill="url(#roll)" stroke="#21140d" stroke-width="3.6"/>
  <rect x="22" y="92" width="66" height="13" rx="6.5" fill="url(#roll)" stroke="#21140d" stroke-width="3.6"/>
  <!-- Handwritten script lines -->
  <g stroke="#6b4b2a" stroke-width="2.6" stroke-linecap="round" opacity=".78">
    <path d="M40 46 H74"/>
    <path d="M39 55 H70"/>
    <path d="M38 64 H68"/>
    <path d="M37 73 H58"/>
    <path d="M36 82 H54"/>
  </g>
  <!-- Wax seal -->
  <path d="M68 83 L63 97 L70 93 L75 98 L76 84 Z" fill="#8f1c18" stroke="#21100e" stroke-width="2.4" stroke-linejoin="round"/>
  <circle cx="71" cy="80" r="10.5" fill="#21100e"/>
  <circle cx="71" cy="80" r="8.4" fill="url(#seal)"/>
  <circle cx="71" cy="80" r="4.8" fill="none" stroke="#f09a78" stroke-opacity=".55" stroke-width="1.3"/>
  <!-- Golden quill feather -->
  <path d="M51 83 C62 67 74 44 96 22 C104 20 107 25 104 33 C98 48 84 65 65 76 L54 83 Z"
        fill="url(#feather)" stroke="#1f140d" stroke-width="3.8" stroke-linejoin="round"/>
  <!-- Feather notches -->
  <path d="M88 39 L97 38 M79 51 L89 50 M70 62 L79 62" stroke="#5b3d1e" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Quill spine & nib -->
  <path d="M45 89 Q68 62 98 27" fill="none" stroke="#23160d" stroke-width="4.4" stroke-linecap="round"/>
  <path d="M46 88 Q68 62 98 27" fill="none" stroke="#f3cf80" stroke-width="2" stroke-linecap="round"/>
  <polygon points="41,94 49,87 46,84" fill="#d9b26c" stroke="#1e130c" stroke-width="2" stroke-linejoin="round"/>
</svg>
