<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="256" height="256">
  <defs>
    <!-- Deep WoW Shaman/Seafarer class-crest ocean backdrop -->
    <radialGradient id="shieldBg" cx="56%" cy="44%" r="58%">
      <stop offset="0%" stop-color="#1b597d"/>
      <stop offset="52%" stop-color="#0d314d"/>
      <stop offset="86%" stop-color="#071929"/>
      <stop offset="100%" stop-color="#030b14"/>
    </radialGradient>
    <radialGradient id="innerRim" cx="32%" cy="24%" r="78%">
      <stop offset="0%" stop-color="#f2cf83"/>
      <stop offset="42%" stop-color="#9e7135"/>
      <stop offset="78%" stop-color="#4f3518"/>
      <stop offset="100%" stop-color="#241609"/>
    </radialGradient>
    <!-- Heavy forged steel hook -->
    <linearGradient id="steelBright" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2f8fc"/>
      <stop offset="42%" stop-color="#a6bac9"/>
      <stop offset="80%" stop-color="#536675"/>
      <stop offset="100%" stop-color="#27333d"/>
    </linearGradient>
    <linearGradient id="steelDark" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b7f8f"/>
      <stop offset="100%" stop-color="#1f2a33"/>
    </linearGradient>
    <!-- Chunky Warcraft brass -->
    <linearGradient id="goldBright" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff4c4"/>
      <stop offset="45%" stop-color="#e3ad4b"/>
      <stop offset="100%" stop-color="#87551c"/>
    </linearGradient>
    <radialGradient id="bobIvory" cx="35%" cy="26%" r="72%">
      <stop offset="0%" stop-color="#fffdf2"/>
      <stop offset="55%" stop-color="#e5cd9c"/>
      <stop offset="100%" stop-color="#8c6c42"/>
    </radialGradient>
    <radialGradient id="bobCrimson" cx="34%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#ff6b42"/>
      <stop offset="50%" stop-color="#c4291b"/>
      <stop offset="100%" stop-color="#540c08"/>
    </radialGradient>
    <filter id="crestAO" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="3.2" flood-color="#020810" flood-opacity=".95"/>
    </filter>
  </defs>

  <!-- Deep class-emblem shield field -->
  <rect width="128" height="128" fill="url(#shieldBg)"/>
  <!-- Heavy forged inner bevel ring -->
  <circle cx="64" cy="64" r="59" fill="none" stroke="url(#innerRim)" stroke-width="6"/>
  <circle cx="64" cy="64" r="55.5" fill="none" stroke="#06121d" stroke-width="2.2"/>

  <!-- Chunky Warcraft Angler Crest: Heavy forged barbed hook + gilded bobber emblem at (72, 54) -->
  <g transform="translate(72, 54)" filter="url(#crestAO)">
    <!-- Massive forged Warcraft barbed fishing hook sweeping behind and around -->
    <path d="M10 -37 C17 -37 19 -28 14 -24 L14 8 C14 28 -10 34 -22 22 C-31 13 -28 -2 -18 -11
             L-10 -2 L-19 -24 L-33 -7 L-25 -3 C-38 10 -34 29 -17 35 C4 42 25 28 25 7 L25 -24
             C30 -28 28 -39 18 -41 C12 -42 7 -40 10 -37 Z"
          fill="url(#steelBright)" stroke="#131920" stroke-width="2.6" stroke-linejoin="round"/>
    <!-- Dark inner bevel on hook shank -->
    <path d="M18 -24 L18 8 C18 25 0 36 -16 30" fill="none" stroke="url(#steelDark)" stroke-width="3.6" stroke-linecap="round"/>
    <!-- Bright specular edge on hook curve & barb -->
    <path d="M14 -20 L14 7 C14 20 2 28 -11 26 M-20 -17 L-28 -7" fill="none" stroke="#ffffff" stroke-opacity=".7" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Heavy brass eye ring at top of hook -->
    <circle cx="19" cy="-32" r="8" fill="#1a1109"/>
    <circle cx="19" cy="-32" r="6.5" fill="url(#goldBright)"/>
    <circle cx="19" cy="-32" r="3" fill="#0d2a42"/>

    <!-- Chunky Warcraft banded red-and-ivory bobber emblem resting in the hook's curve -->
    <g transform="translate(2, 2) rotate(-14)">
      <!-- Heavy brass top & bottom finials -->
      <path d="M-4 -25 L4 -25 L3 -16 L-3 -16 Z" fill="url(#goldBright)" stroke="#1c1108" stroke-width="2" stroke-linejoin="round"/>
      <path d="M-3.5 16 L3.5 16 L2 24 L-2 24 Z" fill="url(#goldBright)" stroke="#1c1108" stroke-width="2" stroke-linejoin="round"/>
      <!-- Bobber sphere -->
      <clipPath id="bobClip2"><circle cx="0" cy="0" r="17"/></clipPath>
      <g clip-path="url(#bobClip2)">
        <rect x="-19" y="-19" width="38" height="20" fill="url(#bobIvory)"/>
        <rect x="-19" y="0" width="38" height="20" fill="url(#bobCrimson)"/>
      </g>
      <!-- Heavy dark rim + chunky riveted brass equatorial band -->
      <circle cx="0" cy="0" r="17" fill="none" stroke="#180e08" stroke-width="2.8"/>
      <path d="M-17.5 -2.2 Q0 2.8 17.5 -2.2 L17.5 2.8 Q0 7.8 -17.5 2.8 Z" fill="url(#goldBright)" stroke="#180e08" stroke-width="2" stroke-linejoin="round"/>
      <!-- Center rivet on band -->
      <circle cx="0" cy="2.6" r="2.6" fill="#fff2bd" stroke="#241509" stroke-width="1.2"/>
      <!-- Bold Warcraft painted specular slash -->
      <path d="M-10 -9 Q-5 -14 3 -12" fill="none" stroke="#ffffff" stroke-opacity=".82" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
</svg>
