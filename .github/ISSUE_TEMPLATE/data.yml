name: Daten einsenden
description: Funde aus dem Spiel (/fp daten export) für ein Update einsenden
title: "Daten: "
labels: ["daten"]
body:
  - type: markdown
    attributes:
      value: |
        Im Spiel `/fp daten export` eingeben, den Text mit Strg+C kopieren und hier einfügen. Er enthält nur Funde (Beute, Gasthäuser, Fahrten, Questdaten), keine Charakterdaten.
        Dein GitHub-Name wird mit dem Beitrag gespeichert. Ein neuer Beitrag von dir ersetzt den älteren (der Export enthält alles bisher Aufgezeichnete).
  - type: textarea
    id: export
    attributes:
      label: Export
      description: Der unveränderte Text aus dem Spiel (beginnt mit "-- @fp-export").
      render: text
    validations:
      required: true
