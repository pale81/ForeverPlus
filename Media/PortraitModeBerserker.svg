<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="256" height="256">
  <defs>
    <radialGradient id="furyBg" cx="60%" cy="44%" r="72%">
      <stop offset="0%" stop-color="#9e2418"/>
      <stop offset="42%" stop-color="#52100c"/>
      <stop offset="76%" stop-color="#240706"/>
      <stop offset="100%" stop-color="#0e0202"/>
    </radialGradient>
    <radialGradient id="emberCore" cx="58%" cy="44%" r="42%">
      <stop offset="0%" stop-color="#ff8338" stop-opacity=".52"/>
      <stop offset="50%" stop-color="#d42615" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="steelL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7fafd"/>
      <stop offset="38%" stop-color="#a8b4c2"/>
      <stop offset="75%" stop-color="#5a636e"/>
      <stop offset="100%" stop-color="#2c3138"/>
    </linearGradient>
    <linearGradient id="steelR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7fafd"/>
      <stop offset="38%" stop-color="#a8b4c2"/>
      <stop offset="75%" stop-color="#5a636e"/>
      <stop offset="100%" stop-color="#2c3138"/>
    </linearGradient>
    <linearGradient id="haft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b57a44"/>
      <stop offset="50%" stop-color="#693e20"/>
      <stop offset="100%" stop-color="#2e180b"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffeaa8"/>
      <stop offset="48%" stop-color="#c98e40"/>
      <stop offset="100%" stop-color="#593314"/>
    </linearGradient>
    <linearGradient id="crimsonEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9944"/>
      <stop offset="35%" stop-color="#f02d1d"/>
      <stop offset="100%" stop-color="#870b0a"/>
    </linearGradient>
    <radialGradient id="furyRuby" cx="35%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#ffd4a3"/>
      <stop offset="38%" stop-color="#eb2d1c"/>
      <stop offset="100%" stop-color="#630808"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#0a0101" flood-opacity=".88"/>
    </filter>
    <filter id="fireGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.6"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feComponentTransfer in="g" result="a"><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feBlend mode="overlay" in="SourceGraphic" in2="a"/>
    </filter>
  </defs>
  <g>
    <rect width="128" height="128" fill="url(#furyBg)"/>
    <rect width="128" height="128" fill="url(#emberCore)"/>
    <!-- Subtle rising battle embers -->
    <g fill="#ffb35c" opacity=".82">
      <circle cx="98" cy="24" r="1.5"/><circle cx="48" cy="22" r="1.2"/><circle cx="108" cy="48" r="1.1"/>
      <circle cx="84" cy="18" r=".9"/><circle cx="34" cy="44" r="1.0"/><circle cx="102" cy="78" r="1.2"/>
    </g>

    <!-- Crossed forged war axes shifted to (74, 52) clear of bottom-left level badge -->
    <g transform="translate(74, 52) scale(0.84)" filter="url(#shadow)">
      <!-- Left axe (blade outward left, handle down-right) -->
      <g transform="rotate(-40)">
        <rect x="-4" y="-42" width="8" height="84" rx="3.5" fill="url(#haft)"/>
        <!-- Pommel & top spike -->
        <circle cx="0" cy="41" r="5.2" fill="url(#brass)"/>
        <polygon points="-5,-38 0,-49 5,-38" fill="url(#brass)"/>
        <!-- Bearded war-axe blade -->
        <path d="M-3 -33 C-16 -39 -31 -40 -40 -31 C-36 -18 -36 -5 -41 9 C-28 13 -14 6 -3 -6 Z" fill="url(#steelL)"/>
        <!-- Back spike -->
        <path d="M4 -28 L16 -22 L4 -16 Z" fill="url(#steelL)"/>
        <!-- Fiery blood edge with soft glow -->
        <path d="M-38 -28 C-34 -16 -34 -4 -38 6" fill="none" stroke="#ff5c26" stroke-width="5" stroke-opacity=".45" stroke-linecap="round" filter="url(#fireGlow)"/>
        <path d="M-38 -28 C-34 -16 -34 -4 -38 6" fill="none" stroke="url(#crimsonEdge)" stroke-width="2.6" stroke-linecap="round"/>
        <!-- Specular bevel ridge on steel -->
        <path d="M-29 -27 C-26 -17 -26 -7 -30 2" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="1.4" stroke-linecap="round"/>
        <!-- Brass socket -->
        <rect x="-6" y="-31" width="12" height="19" rx="2.5" fill="url(#brass)"/>
      </g>
      <!-- Right axe (blade outward right, handle down-left) -->
      <g transform="rotate(40)">
        <rect x="-4" y="-42" width="8" height="84" rx="3.5" fill="url(#haft)"/>
        <circle cx="0" cy="41" r="5.2" fill="url(#brass)"/>
        <polygon points="-5,-38 0,-49 5,-38" fill="url(#brass)"/>
        <path d="M3 -33 C16 -39 31 -40 40 -31 C36 -18 36 -5 41 9 C28 13 14 6 3 -6 Z" fill="url(#steelR)"/>
        <path d="M-4 -28 L-16 -22 L-4 -16 Z" fill="url(#steelR)"/>
        <path d="M38 -28 C34 -16 34 -4 38 6" fill="none" stroke="#ff5c26" stroke-width="5" stroke-opacity=".45" stroke-linecap="round" filter="url(#fireGlow)"/>
        <path d="M38 -28 C34 -16 34 -4 38 6" fill="none" stroke="url(#crimsonEdge)" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M29 -27 C26 -17 26 -7 30 2" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="1.4" stroke-linecap="round"/>
        <rect x="-6" y="-31" width="12" height="19" rx="2.5" fill="url(#brass)"/>
      </g>
      <!-- Center bronze boss & glowing rage ruby -->
      <circle cx="0" cy="2" r="9.5" fill="#2b120c"/>
      <circle cx="0" cy="2" r="7.8" fill="url(#brass)"/>
      <circle cx="0" cy="2" r="4.6" fill="url(#furyRuby)"/>
      <circle cx="-1.5" cy="0.5" r="1.4" fill="#fff0d1" opacity=".88"/>
    </g>
    <!-- Soft dark smoke vignette behind bottom-left level badge -->
    <radialGradient id="blFury" cx="16%" cy="84%" r="44%">
      <stop offset="0%" stop-color="#0a0202" stop-opacity=".86"/>
      <stop offset="100%" stop-color="#0a0202" stop-opacity="0"/>
    </radialGradient>
    <rect width="128" height="128" fill="url(#blFury)"/>
  </g>
</svg>
