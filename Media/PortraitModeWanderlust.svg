<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="256" height="256">
  <defs>
    <radialGradient id="sky" cx="62%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#3a6b8c"/>
      <stop offset="42%" stop-color="#1d3c57"/>
      <stop offset="78%" stop-color="#0f2033"/>
      <stop offset="100%" stop-color="#070e18"/>
    </radialGradient>
    <radialGradient id="horizonGlow" cx="60%" cy="62%" r="48%">
      <stop offset="0%" stop-color="#f2b866" stop-opacity=".42"/>
      <stop offset="55%" stop-color="#c47a3a" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dial" cx="46%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#295272"/>
      <stop offset="60%" stop-color="#12273c"/>
      <stop offset="100%" stop-color="#08121f"/>
    </radialGradient>
    <linearGradient id="brassRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff2c2"/>
      <stop offset="28%" stop-color="#e3ae57"/>
      <stop offset="68%" stop-color="#9e692c"/>
      <stop offset="100%" stop-color="#4e2e12"/>
    </linearGradient>
    <linearGradient id="brassInner" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe7a3"/>
      <stop offset="50%" stop-color="#b57d36"/>
      <stop offset="100%" stop-color="#45270f"/>
    </linearGradient>
    <linearGradient id="goldLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff8d6"/>
      <stop offset="55%" stop-color="#dfaa4e"/>
      <stop offset="100%" stop-color="#8c5821"/>
    </linearGradient>
    <linearGradient id="goldShade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a8702e"/>
      <stop offset="100%" stop-color="#45260e"/>
    </linearGradient>
    <linearGradient id="northRuby" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff8d54"/>
      <stop offset="48%" stop-color="#cf3622"/>
      <stop offset="100%" stop-color="#69120c"/>
    </linearGradient>
    <radialGradient id="centerGem" cx="35%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#fffbe0"/>
      <stop offset="45%" stop-color="#e8b254"/>
      <stop offset="100%" stop-color="#6e3d14"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#04080f" flood-opacity=".85"/>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feComponentTransfer in="g" result="a"><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feBlend mode="overlay" in="SourceGraphic" in2="a"/>
    </filter>
  </defs>
  <g>
    <!-- Full-bleed twilight sky & distant mountain silhouettes -->
    <rect width="128" height="128" fill="url(#sky)"/>
    <rect width="128" height="128" fill="url(#horizonGlow)"/>
    <!-- Subtle stars in upper sky -->
    <g fill="#fff4d2" opacity=".7">
      <circle cx="28" cy="24" r="1.1"/><circle cx="44" cy="16" r=".8"/><circle cx="96" cy="20" r="1.2"/>
      <circle cx="110" cy="34" r=".9"/><circle cx="20" cy="46" r=".8"/><circle cx="112" cy="64" r=".7"/>
    </g>
    <!-- Misty mountain ridges (darkest in bottom-left behind the level badge) -->
    <path d="M0 92 L22 72 L40 82 L66 64 L92 78 L114 66 L128 74 L128 128 L0 128 Z" fill="#102235" opacity=".75"/>
    <path d="M0 102 L26 86 L54 96 L84 82 L112 94 L128 88 L128 128 L0 128 Z" fill="#091422" opacity=".9"/>
    <!-- Ambient golden halo behind compass -->
    <circle cx="72" cy="54" r="36" fill="#f5c06a" opacity=".18" filter="url(#softGlow)"/>

    <!-- Ornate compass shifted to (72, 54) so bottom-left level badge stays completely clear -->
    <g transform="translate(72, 54)" filter="url(#shadow)">
      <!-- Top brass suspension ring -->
      <circle cx="0" cy="-39" r="5.5" fill="none" stroke="url(#brassRim)" stroke-width="2.6"/>
      <rect x="-3.5" y="-36" width="7" height="5" rx="1.5" fill="url(#brassRim)"/>
      <!-- Outer beveled brass casing -->
      <circle cx="0" cy="0" r="35" fill="url(#brassRim)"/>
      <circle cx="0" cy="0" r="32.2" fill="#3a2310"/>
      <circle cx="0" cy="0" r="30.6" fill="url(#brassInner)"/>
      <!-- Deep sapphire compass face -->
      <circle cx="0" cy="0" r="28" fill="url(#dial)"/>
      <!-- Fine engraved compass circles & tick marks -->
      <circle cx="0" cy="0" r="24" fill="none" stroke="#9fd3f0" stroke-opacity=".28" stroke-width=".9"/>
      <circle cx="0" cy="0" r="17" fill="none" stroke="#e5ba6c" stroke-opacity=".22" stroke-width=".8" stroke-dasharray="2 3"/>
      <g stroke="#e8c37a" stroke-opacity=".45" stroke-width="1">
        <line x1="0" y1="-27" x2="0" y2="-23"/><line x1="27" y1="0" x2="23" y2="0"/>
        <line x1="0" y1="27" x2="0" y2="23"/><line x1="-27" y1="0" x2="-23" y2="0"/>
        <line x1="19" y1="-19" x2="16.5" y2="-16.5"/><line x1="19" y1="19" x2="16.5" y2="16.5"/>
        <line x1="-19" y1="19" x2="-16.5" y2="16.5"/><line x1="-19" y1="-19" x2="-16.5" y2="-16.5"/>
      </g>
      <!-- Diagonal minor points -->
      <polygon points="0,0 16,-16 4,0" fill="url(#goldLight)"/>
      <polygon points="0,0 16,-16 0,-4" fill="url(#goldShade)"/>
      <polygon points="0,0 16,16 0,4" fill="url(#goldLight)"/>
      <polygon points="0,0 16,16 4,0" fill="url(#goldShade)"/>
      <polygon points="0,0 -16,16 -4,0" fill="url(#goldLight)"/>
      <polygon points="0,0 -16,16 0,4" fill="url(#goldShade)"/>
      <polygon points="0,0 -16,-16 0,-4" fill="url(#goldLight)"/>
      <polygon points="0,0 -16,-16 -4,0" fill="url(#goldShade)"/>
      <!-- Major cardinal points (East, South, West) -->
      <polygon points="0,0 28,0 0,-6.2" fill="url(#goldLight)"/>
      <polygon points="0,0 28,0 0,6.2" fill="url(#goldShade)"/>
      <polygon points="0,0 0,28 6.2,0" fill="url(#goldLight)"/>
      <polygon points="0,0 0,28 -6.2,0" fill="url(#goldShade)"/>
      <polygon points="0,0 -28,0 0,6.2" fill="url(#goldLight)"/>
      <polygon points="0,0 -28,0 0,-6.2" fill="url(#goldShade)"/>
      <!-- North needle (crimson + bright gold facet) -->
      <polygon points="0,0 0,-29 -6.8,0" fill="url(#northRuby)"/>
      <polygon points="0,0 0,-29 6.8,0" fill="url(#goldLight)"/>
      <!-- Specular glass sheen over upper dial -->
      <path d="M-21 -14 A25 25 0 0 1 21 -14 Q0 -4 -21 -14 Z" fill="#dff4ff" opacity=".16"/>
      <!-- Center gilded boss -->
      <circle cx="0" cy="0" r="7.2" fill="#3b220e"/>
      <circle cx="0" cy="0" r="6" fill="url(#centerGem)"/>
      <circle cx="-1.8" cy="-1.8" r="1.9" fill="#fffde8" opacity=".88"/>
    </g>
    <!-- Soft bottom-left shadow vignette so level badge blends cleanly -->
    <radialGradient id="blShade" cx="16%" cy="84%" r="42%">
      <stop offset="0%" stop-color="#050a12" stop-opacity=".72"/>
      <stop offset="100%" stop-color="#050a12" stop-opacity="0"/>
    </radialGradient>
    <rect width="128" height="128" fill="url(#blShade)"/>
  </g>
</svg>
