<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="256" height="256">
  <defs>
    <!-- Deep WoW Warrior class-crest forged iron/crimson backdrop -->
    <radialGradient id="shieldBg" cx="56%" cy="44%" r="58%">
      <stop offset="0%" stop-color="#8c1e16"/>
      <stop offset="48%" stop-color="#470e0c"/>
      <stop offset="84%" stop-color="#210606"/>
      <stop offset="100%" stop-color="#0d0202"/>
    </radialGradient>
    <radialGradient id="innerRim" cx="32%" cy="24%" r="78%">
      <stop offset="0%" stop-color="#e3eef5"/>
      <stop offset="38%" stop-color="#85929e"/>
      <stop offset="76%" stop-color="#3e464f"/>
      <stop offset="100%" stop-color="#191d21"/>
    </radialGradient>
    <!-- Hard faceted Warcraft steel blades -->
    <linearGradient id="steelLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="42%" stop-color="#b4c0cc"/>
      <stop offset="100%" stop-color="#5d6875"/>
    </linearGradient>
    <linearGradient id="steelShade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6e7a87"/>
      <stop offset="100%" stop-color="#272d34"/>
    </linearGradient>
    <linearGradient id="haft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b87b42"/>
      <stop offset="50%" stop-color="#6b3e1d"/>
      <stop offset="100%" stop-color="#2c1609"/>
    </linearGradient>
    <linearGradient id="goldBright" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff0b3"/>
      <stop offset="48%" stop-color="#c98e3d"/>
      <stop offset="100%" stop-color="#573112"/>
    </linearGradient>
    <linearGradient id="bloodEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff8038"/>
      <stop offset="45%" stop-color="#e62017"/>
      <stop offset="100%" stop-color="#7d0908"/>
    </linearGradient>
    <radialGradient id="rageCore" cx="35%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#ffe0ad"/>
      <stop offset="36%" stop-color="#f22918"/>
      <stop offset="75%" stop-color="#8c0c0a"/>
      <stop offset="100%" stop-color="#380404"/>
    </radialGradient>
    <filter id="crestAO" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="3.2" flood-color="#080101" flood-opacity=".96"/>
    </filter>
  </defs>

  <!-- Deep Warrior-style class-emblem shield field -->
  <rect width="128" height="128" fill="url(#shieldBg)"/>
  <!-- Heavy forged steel inner class-icon bevel ring -->
  <circle cx="64" cy="64" r="59" fill="none" stroke="url(#innerRim)" stroke-width="6"/>
  <circle cx="64" cy="64" r="55.5" fill="none" stroke="#140404" stroke-width="2.2"/>

  <!-- Massive Chunky Warcraft Warrior Crossed Battleaxes at (74, 52) -->
  <g transform="translate(74, 52) scale(0.9)" filter="url(#crestAO)">
    <!-- Left war axe (blade outward left, heavy battle-notched silhouette) -->
    <g transform="rotate(-41)">
      <rect x="-5" y="-42" width="10" height="84" rx="3" fill="url(#haft)" stroke="#170a06" stroke-width="2.8"/>
      <!-- Leather grip wraps -->
      <path d="M-5 14 L5 18 M-5 24 L5 28" stroke="#2e170a" stroke-width="2.2"/>
      <circle cx="0" cy="40" r="6.5" fill="url(#goldBright)" stroke="#170a06" stroke-width="2.5"/>
      <polygon points="-6,-36 0,-49 6,-36" fill="url(#goldBright)" stroke="#170a06" stroke-width="2.4" stroke-linejoin="round"/>
      <!-- Massive notched Warcraft axe head (upper bright facet + lower dark facet) -->
      <path d="M-4 -33 C-18 -41 -34 -42 -43 -32 C-40 -22 -40 -15 -43 -11 L-37 -8 L-43 -3 C-41 4 -42 10 -44 14 C-30 18 -14 10 -4 -3 Z"
            fill="url(#steelLight)" stroke="#150d0c" stroke-width="2.8" stroke-linejoin="round"/>
      <path d="M-4 -18 L-39 -9 L-44 14 C-30 18 -14 10 -4 -3 Z" fill="url(#steelShade)" opacity=".55"/>
      <!-- Heavy back spike -->
      <path d="M5 -28 L19 -20 L5 -12 Z" fill="url(#steelLight)" stroke="#150d0c" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- Glowing crimson honed edge -->
      <path d="M-40 -29 C-37 -21 -38 -15 -40 -11 M-40 -2 C-39 4 -39 8 -41 12" fill="none" stroke="url(#bloodEdge)" stroke-width="3.6" stroke-linecap="round"/>
      <!-- Chunky forged brass collar with rivet -->
      <rect x="-7.5" y="-31" width="15" height="22" rx="2.5" fill="url(#goldBright)" stroke="#170a06" stroke-width="2.6"/>
      <circle cx="0" cy="-20" r="2.2" fill="#3b200a"/>
    </g>
    <!-- Right war axe -->
    <g transform="rotate(41)">
      <rect x="-5" y="-42" width="10" height="84" rx="3" fill="url(#haft)" stroke="#170a06" stroke-width="2.8"/>
      <path d="M-5 14 L5 18 M-5 24 L5 28" stroke="#2e170a" stroke-width="2.2"/>
      <circle cx="0" cy="40" r="6.5" fill="url(#goldBright)" stroke="#170a06" stroke-width="2.5"/>
      <polygon points="-6,-36 0,-49 6,-36" fill="url(#goldBright)" stroke="#170a06" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M4 -33 C18 -41 34 -42 43 -32 C40 -22 40 -15 43 -11 L37 -8 L43 -3 C41 4 42 10 44 14 C30 18 14 10 4 -3 Z"
            fill="url(#steelLight)" stroke="#150d0c" stroke-width="2.8" stroke-linejoin="round"/>
      <path d="M4 -18 L39 -9 L44 14 C30 18 14 10 4 -3 Z" fill="url(#steelShade)" opacity=".55"/>
      <path d="M-5 -28 L-19 -20 L-5 -12 Z" fill="url(#steelLight)" stroke="#150d0c" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M40 -29 C37 -21 38 -15 40 -11 M40 -2 C39 4 39 8 41 12" fill="none" stroke="url(#bloodEdge)" stroke-width="3.6" stroke-linecap="round"/>
      <rect x="-7.5" y="-31" width="15" height="22" rx="2.5" fill="url(#goldBright)" stroke="#170a06" stroke-width="2.6"/>
      <circle cx="0" cy="-20" r="2.2" fill="#3b200a"/>
    </g>
    <!-- Heavy riveted iron/bronze boss with blazing rage gem -->
    <circle cx="0" cy="3" r="13" fill="#170806"/>
    <circle cx="0" cy="3" r="10.8" fill="url(#goldBright)"/>
    <circle cx="0" cy="3" r="6.8" fill="#1c0505"/>
    <circle cx="0" cy="3" r="5.8" fill="url(#rageCore)"/>
    <ellipse cx="-2" cy="1" rx="2.2" ry="1.5" transform="rotate(-35 -2 1)" fill="#fff2d6" opacity=".9"/>
  </g>
</svg>
