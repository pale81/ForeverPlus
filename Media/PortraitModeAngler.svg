<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="256" height="256">
  <defs>
    <radialGradient id="lake" cx="62%" cy="44%" r="72%">
      <stop offset="0%" stop-color="#348b9c"/>
      <stop offset="44%" stop-color="#19566c"/>
      <stop offset="78%" stop-color="#0c2c3d"/>
      <stop offset="100%" stop-color="#06141e"/>
    </radialGradient>
    <radialGradient id="sunReflect" cx="66%" cy="32%" r="44%">
      <stop offset="0%" stop-color="#ffe7a6" stop-opacity=".42"/>
      <stop offset="50%" stop-color="#69d4e3" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rodWood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fae0a2"/>
      <stop offset="42%" stop-color="#c48341"/>
      <stop offset="100%" stop-color="#5c3318"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff0b8"/>
      <stop offset="48%" stop-color="#c89242"/>
      <stop offset="100%" stop-color="#5c3817"/>
    </linearGradient>
    <radialGradient id="bobberTop" cx="36%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#fffcf0"/>
      <stop offset="58%" stop-color="#e5cfa4"/>
      <stop offset="100%" stop-color="#9e7f54"/>
    </radialGradient>
    <radialGradient id="bobberRed" cx="35%" cy="36%" r="72%">
      <stop offset="0%" stop-color="#ff744d"/>
      <stop offset="48%" stop-color="#c93622"/>
      <stop offset="100%" stop-color="#5e130c"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#041019" flood-opacity=".8"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feComponentTransfer in="g" result="a"><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
      <feBlend mode="overlay" in="SourceGraphic" in2="a"/>
    </filter>
  </defs>
  <g>
    <!-- Rich painterly lake surface -->
    <rect width="128" height="128" fill="url(#lake)"/>
    <rect width="128" height="128" fill="url(#sunReflect)"/>
    <!-- Painterly water shimmer bands -->
    <g fill="none" stroke-linecap="round">
      <path d="M44 46 Q68 42 98 47" stroke="#9ce8f5" stroke-opacity=".22" stroke-width="2.2"/>
      <path d="M52 56 Q80 51 114 58" stroke="#ffeab5" stroke-opacity=".2" stroke-width="1.8"/>
      <path d="M36 92 Q74 86 118 93" stroke="#6cc2d9" stroke-opacity=".22" stroke-width="2"/>
    </g>
    <!-- Concentric sunlit ripples around bobber at (78, 69) -->
    <ellipse cx="78" cy="72" rx="34" ry="12" fill="none" stroke="#8de6f7" stroke-opacity=".26" stroke-width="1.8"/>
    <ellipse cx="78" cy="72" rx="23" ry="8" fill="none" stroke="#bef4ff" stroke-opacity=".46" stroke-width="2.1"/>
    <ellipse cx="78" cy="72" rx="13" ry="4.8" fill="none" stroke="#fff4d6" stroke-opacity=".7" stroke-width="2"/>
    <!-- Bobber water reflection -->
    <ellipse cx="78" cy="79" rx="11" ry="5" fill="#c93a24" opacity=".28" filter="url(#glow)"/>

    <!-- Curved wooden fishing rod entering gracefully from upper-left to upper-right -->
    <g filter="url(#shadow)">
      <!-- Glowing fishing line from rod tip down to bobber -->
      <path d="M88 22 C96 29 94 42 82 52 L79 58" fill="none" stroke="#e9dec4" stroke-opacity=".88" stroke-width="1.7" stroke-linecap="round"/>
      <!-- Tapered rod shaft curving over top -->
      <path d="M24 58 Q54 34 86 20 Q90 19 91 22 Q60 40 31 64 Z" fill="url(#rodWood)"/>
      <path d="M29 58 Q56 36 87 21.5" fill="none" stroke="#fff0c4" stroke-opacity=".65" stroke-width="1.3" stroke-linecap="round"/>
      <!-- Brass ferrules along the rod -->
      <path d="M37 49 L41 54 M55 37 L58 42 M71 27 L73 31" stroke="url(#brass)" stroke-width="3.6" stroke-linecap="round"/>
      <!-- Small gleaming brass reel on the upper-mid shaft (well above level badge) -->
      <circle cx="48" cy="52" r="8.2" fill="#331e10"/>
      <circle cx="48" cy="52" r="6.8" fill="url(#brass)"/>
      <circle cx="48" cy="52" r="3.8" fill="#3a332b"/>
      <circle cx="48" cy="52" r="1.7" fill="#ffe8b0"/>
      <path d="M51.5 54.5 L55.5 58" stroke="url(#brass)" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="56" cy="58.5" r="2.2" fill="#f7d58b"/>

      <!-- Hero red-and-ivory bobber at (78, 63), prominent and clear of bottom-left badge -->
      <g transform="translate(78, 63) rotate(-8)">
        <!-- Upper ivory peg & gold ring -->
        <rect x="-1.8" y="-21" width="3.6" height="8" rx="1.6" fill="url(#brass)"/>
        <rect x="-1.5" y="13" width="3" height="6" rx="1.4" fill="url(#brass)"/>
        <!-- Glossy sphere: ivory top half, crimson bottom half -->
        <clipPath id="bobClip"><ellipse cx="0" cy="0" rx="14.5" ry="15.5"/></clipPath>
        <g clip-path="url(#bobClip)">
          <rect x="-16" y="-17" width="32" height="18" fill="url(#bobberTop)"/>
          <path d="M-16 -1 Q0 3.5 16 -1 L16 18 L-16 18 Z" fill="url(#bobberRed)"/>
          <!-- Soft rim shading -->
          <ellipse cx="0" cy="0" rx="14.5" ry="15.5" fill="none" stroke="#240f0a" stroke-opacity=".55" stroke-width="2.2"/>
        </g>
        <!-- Crisp wet specular highlight -->
        <ellipse cx="-5" cy="-6" rx="3.4" ry="5.5" transform="rotate(-18 -5 -6)" fill="#ffffff" opacity=".72"/>
        <circle cx="-4.5" cy="5" r="1.7" fill="#ffd9b3" opacity=".62"/>
      </g>
    </g>
    <!-- Sparkling water droplets -->
    <g fill="#dffaff" opacity=".82">
      <circle cx="96" cy="60" r="1.4"/><circle cx="60" cy="66" r="1.2"/><circle cx="91" cy="51" r="1.0"/>
    </g>
    <!-- Quiet dark water vignette behind bottom-left level badge -->
    <radialGradient id="blWater" cx="16%" cy="84%" r="44%">
      <stop offset="0%" stop-color="#041018" stop-opacity=".82"/>
      <stop offset="100%" stop-color="#041018" stop-opacity="0"/>
    </radialGradient>
    <rect width="128" height="128" fill="url(#blWater)"/>
  </g>
</svg>
